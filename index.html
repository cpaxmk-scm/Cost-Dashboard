}

/* =========================== UNIT COST =========================== */
function pgUnit(el){
  const i=mi(S.month);
  /* ---- cost per order: B2C average, ranking and per-site split ---- */
  /* B2C figures follow the SAME period as the rest of the page: one month in Monthly
     mode, Jan..selected in YTD. Summing cost and orders across the period before
     dividing is the only correct way to do it — averaging the monthly rates would
     weight a quiet January the same as a busy July. */
  const pIdx = periodIdx();
  const sumOver = (idx, f) => idx.reduce((a,k)=> a + (f(k)||0), 0);
  const ordOf = (c,idx) => sumOver(idx, k=>FC[c].orders[k]);
  const opOf  = (c,idx) => sumOver(idx, k=>FC[c].op[k]);
  const lmOf  = (c,idx) => sumOver(idx, k=>fcLmOf(c)[k]);
  const rate  = (cost,ord) => ord ? cost*1e6/ord : null;
  /* previous basis: prior month in Monthly mode, same period last year in YTD */
  const prevIdx = (S.mode==='M') ? (i>0?[i-1]:[]) : pIdx.map(k=>k-12).filter(k=>k>=0);

  const cpoOf = (c,idx) => rate(opOf(c,idx)+lmOf(c,idx), ordOf(c,idx));
  const ordAll = idx => FC_ORDER.reduce((a,c)=>a+ordOf(c,idx),0);
  const cstAll = idx => FC_ORDER.reduce((a,c)=>a+opOf(c,idx)+lmOf(c,idx),0);
  /* single-month versions — the month-by-month history table below needs a value
     per row, which is a different question from the period figure in the cards */
  const ordAt = k => FC_ORDER.reduce((a,c)=>a+(FC[c].orders[k]||0),0);
  const cstAt = k => FC_ORDER.reduce((a,c)=>a+(FC[c].op[k]||0)+(fcLmOf(c)[k]||0),0);
  const cpoNet     = rate(cstAll(pIdx),    ordAll(pIdx));
  const cpoNetPrev = prevIdx.length ? rate(cstAll(prevIdx), ordAll(prevIdx)) : null;
  const cpoRank = FC_ORDER.filter(c=>cpoOf(c,pIdx)!=null).map(c=>({c, name:FC_SHORT[c],
      v:  cpoOf(c,pIdx),
      op: rate(opOf(c,pIdx), ordOf(c,pIdx)),
      lm: rate(lmOf(c,pIdx), ordOf(c,pIdx)),
      prev: prevIdx.length ? cpoOf(c,prevIdx) : null})).sort((a,b)=>b.v-a.v);
  /* DC cost INCLUDES the TFRS16 lease add-on — TFRS16 is distribution-centre cost,
     so excluding it understated every DC rate and broke card1 = card2 + card3. */
  const dryWH=add(dcRaw('Dry','total_wh'),dcRaw('Dry','tfrs16')), dryIn=dcRaw('Dry','inbound_case'), dryGrand=dcRaw('Dry','grand_total');
  const freshWH=add(dcRaw('Fresh','total_wh'),dcRaw('Fresh','tfrs16')), freshKg=dcRaw('Fresh','ton').map(t=>t*1000), freshGrand=dcRaw('Fresh','grand_total');
  const mmC=dcRaw('Dry','transport'), outC=dcRaw('Dry','outbound_case'), trips=dcRaw('Dry','trip');
  const freshMM=dcRaw('Fresh','transport');
  const _fAll=unitNow(freshGrand,freshKg), _fMM=unitNow(freshMM,freshKg);
  const fmShare=(_fAll&&_fMM!=null&&_fAll>0)? _fMM/_fAll : null;
  /* A unit cost below zero is not a real rate — it comes from credit/allocation entries
     in the source ledger. Show a dash and say so rather than print "-236 THB/case". */
  const uVal=(cost,vol)=>{ const v=unitNow(cost,vol); return (v==null||!isFinite(v)||v<0)? null : v; };
  const uCard=(t,cost,vol,unit,dec=2,bd='',sub='')=>{
    const v=uVal(cost,vol), p=uVal(cost.map((_,k)=>cost[k]),vol);
    const prev=unitPrev(cost,vol), yoy=unitYoY(cost,vol);
    return kpi({title:t, val: v==null? '<span class="mut">–</span>' : fmt(v,dec), unit, badge:bd,
      sub: v==null? 'not meaningful this period — credit entries in the source' : sub,
      chips: v==null? [`<span class="chip na">n/a</span>`]
        : [chip(v, (prev!=null&&prev>0)?prev:null, cmpLbl()), chip(v, (yoy!=null&&yoy>0)?yoy:null, 'YoY')]});
  };

  const dash='<span class="mut">–</span>';
  const fcRows=FC_ORDER.map(c=>{
    const f=FC[c]; const ord=f.orders[i];
    if(!ord) return [`<span class="name">${f.name}</span> ${c==='FC409'?BADGES.fc409:(c==='FC411'?'<span class="chip lbl">ramp-up</span>':'')}`, dash, dash, dash, dash, dash];
    const lmArr=fcLmOf(c);
    const wo=f.op[i]*1e6/ord, lo=(lmArr[i]||0)*1e6/ord, to=wo+lo;
    const pOrd=f.orders[i-1], pTo=pOrd? (f.op[i-1]+(lmArr[i-1]||0))*1e6/pOrd : null;
    const vsAvg = cpoNet? to/cpoNet-1 : null;
    return [`<span class="name">${f.name}</span> ${c==='FC403'?BADGES.fc403:''}`, fmt(ord,0), fmt(wo,0), fmt(lo,0), `<b>${fmt(to,0)}</b>`, pctCell(vsAvg), pctCell(pTo?to/pTo-1:null)];
  });

  /* ---- historical unit-cost table: one row per month, B2B and B2C side by side ---- */
  const uRows = MONTHS.slice(winStart(), winEnd()+1).map((mo,ix)=>{
    const k = winStart()+ix;
    const dU = dryIn[k]? dryWH[k]/dryIn[k] : null;
    const dA = dryIn[k]? dryGrand[k]/dryIn[k] : null;
    const fU = freshKg[k]? freshWH[k]/freshKg[k] : null;
    const fA = freshKg[k]? freshGrand[k]/freshKg[k] : null;
    const mt = trips[k]? mmC[k]/trips[k] : null;
    const ord = ordAt(k), cpo = ord? cstAt(k)*1e6/ord : null;
    const g = (v,d=2)=> v==null? '<span class="mut">–</span>' : fmt(v,d);
    return [`<span class="name">${LBL[k]}</span>`, g(dU), g(dA), g(fU), g(fA), g(mt,0), ord? fmt(ord,0):'<span class="mut">–</span>', g(cpo,0)];
  }).reverse();

  el.innerHTML = `
  <div class="section-h" style="margin-top:0">
    <h5>B2B — what it costs to move one case / one kilogram</h5><div class="ln"></div>
    <span class="mini">Distribution Center operation + Mid-Mile transport · ${modeLbl()}</span></div>
  <div class="section-h" style="margin-top:10px">
    <h5><span class="swatch" style="background:${TEMP_COLOR.Dry}"></span>DRY — unit costs</h5><div class="ln"></div>
    <span class="mini">${modeLbl()} · cases are the volume driver</span></div>
  <div class="grid cards4">
    ${uCard('1 · Total Dry Cost per case', dryGrand, dryIn,'THB/Case',2,'',"DC operation + TFRS16 + Mid-Mile ÷ inbound cases")}
    ${uCard('2 · DC Cost per case', dryWH, dryIn,'THB/Case',2,'',"(warehouse cost + TFRS16) ÷ inbound cases")}
    ${uCard('3 · Mid-Mile Transport per case', mmC, dryIn,'THB/Case',2,'',"mid-mile transport ÷ inbound cases")}
    ${uCard('4 · Dry Mid-Mile per trip', mmC, trips,'THB/Trip',0,'',"mid-mile transport ÷ dry trips")}
  </div>
  <div class="note" style="margin-top:8px">Card 1 = card 2 + card 3 exactly — DC cost includes the TFRS16 lease add-on. All three divide by the same inbound cases, so they read on one scale.</div>
  <div class="section-h">
    <h5><span class="swatch" style="background:${TEMP_COLOR.Fresh}"></span>FRESH — unit costs</h5><div class="ln"></div>
    <span class="mini">${modeLbl()} · kilograms are the volume driver</span></div>
  <div class="grid cards4">
    ${uCard('1 · Total Fresh Cost per kg', freshGrand, freshKg,'THB/Kg',2,' '+BADGES.perKg,"DC operation + TFRS16 + Mid-Mile ÷ kg")}
    ${uCard('2 · DC Cost per kg', freshWH, freshKg,'THB/Kg',2,'',"warehouse cost ÷ kg (file convention, excl. TFRS16)")}
    ${uCard('3 · Fresh Mid-Mile Transport per kg', freshMM, freshKg,'THB/Kg',2,'',"mid-mile transport ÷ kg")}
    ${kpi({title:'4 · Mid-Mile share of Fresh cost', val: fmShare==null? '<span class="mut">–</span>' : fmt(fmShare*100,1), unit:'%',
      sub: fmShare==null? '' : 'transport as a share of the all-in cost per kg',
      badge:' '+info('Fresh trips are not recorded in the source workbook, so a Fresh cost-per-trip cannot be calculated. This card shows the mid-mile share of the all-in cost per kilogram instead.')})}
  </div>
  <div class="note" style="margin-top:8px">Card 1 = card 2 + card 3 + the TFRS16 lease add-on. All three divide by the same kilograms.</div>
  <div class="grid g2e" style="margin-top:14px">
    <div class="card">${chBox('chUDry',260,'Dry unit cost trend (THB/Case)')}
      <div class="note">The pale dotted rules join the two lines each month — that gap <b>is</b> the Mid-Mile transport per case. Hover a rule to read the figure.</div></div>
    <div class="card">${chBox('chUFresh',260,'Fresh unit cost trend (THB/Kg)')}
      <div class="note">The pale dotted rules join the two lines each month — that gap <b>is</b> the Mid-Mile transport per kilogram. Hover a rule to read the figure.</div></div>
  </div>
  <div class="section-h"><h5>B2C — What one order costs to fulfill and deliver</h5><div class="ln"></div><span class="mini">${label(S.month)} · cost per order includes fulfillment operation + last-mile delivery · source: ${SRC_NAME[curSrc()]} ${info('Use the “Source of data” switch in the top bar to compare the two systems. FC P&L books delivery in the fulfillment ledger (sales from Axtra Omni Channel); the LMD file books the same trips from the delivery operation (sales from RMS). Cost and sales switch together, so the ratio is never mixed.')}</span></div>
  <div class="grid cards4" style="margin-bottom:14px">
    ${kpi({title:'B2C Cost per Order', val:cpoNet!=null? fmt(cpoNet,0):'–', unit:'THB / order',
      sub:'all fulfillment centers together — total B2C cost ÷ total orders', badge:' '+srcBadge(),
      chips:[chip(cpoNet, cpoNetPrev, cmpLbl())]})}
    ${kpi({title:'Cheapest Cost per Order', val:cpoRank.length? fmt(cpoRank[cpoRank.length-1].v,0):'–', unit:'THB / order',
      sub:cpoRank.length? cpoRank[cpoRank.length-1].name : ''})}
    ${kpi({title:'Highest Cost per Order', val:cpoRank.length? fmt(cpoRank[0].v,0):'–', unit:'THB / order',
      sub:cpoRank.length? cpoRank[0].name : ''})}
    ${kpi({title:'Cost per Order Gap', val:cpoRank.length>1? fmt(cpoRank[0].v-cpoRank[cpoRank.length-1].v,0):'–', unit:'THB / order',
      sub:'highest minus cheapest — the spread across centers'})}
  </div>
  <div class="grid g2">
    <div class="card">${chBox('chUFC',320,'Cost per order by fulfillment center — '+label(S.month)+' (THB)')}
      <div class="note">One bar per center, tallest cost first. Each bar splits into <span class="swatch" style="background:${SEGCOL.fcop}"></span>fulfillment operation and <span class="swatch" style="background:${SEGCOL.lm}"></span>last-mile delivery, and the dashed line is the B2C average of ${cpoNet!=null? fmt(cpoNet,0):'–'} THB. Read it as: how much does it cost us to get one order out of this site.</div></div>
    <div class="card"><h4>The same figures as a table — ${label(S.month)}</h4>${tbl(['Fulfillment Center','Orders','Operation / order','Last-mile / order','Total / order','vs B2C average','MoM'],fcRows)}
      <div class="note">Orders = average orders per day × days in the month (equals sales ÷ AOV). A center above the B2C average is dearer to serve than the average order.</div></div>
  </div>

  <div class="section-h"><h5>Unit cost history — B2B and B2C together</h5><div class="ln"></div>
    <span class="mini">last ${uRows.length} months, newest first</span></div>
  <div class="card">
    ${tbl(['Month','Dry DC /case','Dry all-in /case','Fresh DC /kg','Fresh all-in /kg','Mid-Mile /trip','B2C orders','B2C cost /order'],uRows)}
    <div class="note"><b>B2B</b> — “DC” is warehouse cost ÷ volume (the file convention, excluding TFRS16 and mid-mile); “all-in” adds mid-mile transport, so the difference between the two columns is the mid-mile share. <b>B2C</b> — cost per order is fulfillment operation + last-mile delivery ÷ orders, from ${SRC_NAME[curSrc()]}. All values in THB.</div>
  </div>`;

  /* the band between the two lines = the mid-mile share of the all-in unit cost */
  mkChart('chUDry',{type:'line',data:{labels:wLBL(),datasets:[
    line({label:'DC',data:sl(unitArr(dryWH,dryIn)),borderColor:C.gold,dec:2,dl:{...dl2,mode:'last'}}),
    line({label:'Total Dry',data:sl(unitArr(dryGrand,dryIn)),borderColor:C.navy,dec:2,dl:{...dl2,mode:'last'},
      connectTo:'DC', connectColor:SEGCOL.mm, connectLabel:'Mid-Mile per case', connectTag:'Mid-Mile', dec:2, suffix:' THB'}),
  ]},options:{...padR,scales:{x:gridX,y:{...gridY,title:{display:true,text:'THB/Case'}}}}});
  mkChart('chUFresh',{type:'line',data:{labels:wLBL(),datasets:[
    line({label:'DC',data:sl(unitArr(freshWH,freshKg)),borderColor:C.gold,dec:2,dl:{...dl2,mode:'last'}}),
    line({label:'Total Fresh',data:sl(unitArr(freshGrand,freshKg)),borderColor:C.teal,dec:2,dl:{...dl2,mode:'last'},
      connectTo:'DC', connectColor:SEGCOL.mm, connectLabel:'Mid-Mile per kg', connectTag:'Mid-Mile', dec:2, suffix:' THB'}),
  ]},options:{...padR,scales:{x:gridX,y:{...gridY,title:{display:true,text:'THB/Kg'}}}}});
  /* One horizontal bar per center: operation + last-mile stacked, network
     average as a dashed reference. Horizontal keeps the site names readable
     however many centers open later. */
  mkChart('chUFC',{type:'bar',data:{labels:cpoRank.map(r=>r.name),datasets:[
    {label:'Fulfillment operation / order',data:cpoRank.map(r=>r.op),backgroundColor:SEGCOL.fcop,stack:'s',borderRadius:3,dl:{dec:0}},
    {label:'Last-mile delivery / order',   data:cpoRank.map(r=>r.lm),backgroundColor:SEGCOL.lm,  stack:'s',borderRadius:3,dl:{dec:0}},
  ]},options:{indexAxis:'y',...padR,shareOf:'the cost per order',plugins:{avg:{value:cpoNet||0,label:'B2C average '+(cpoNet!=null?fmt(cpoNet,0):'')}},
    scales:{x:{...gridY,stacked:true,title:{display:true,text:'THB per order'}},y:{...gridX,stacked:true}}}});
}

/* =========================== DISTRIBUTION CENTER =========================== */
const DC_SECS=[['personnel','Personnel'],['establishment','Establishment'],['sales_promo','Sales Promo'],['computer','Computer'],['repair_maint','R&M'],['general','General (incl. outsourcing)'],['depreciation','D&A'],['rent','Rent'],['financial','Financial']];
function pgDC(el){
  const chipsRow = `<div class="selrow">
    <span class="sc ${S.dc==='OVERVIEW'?'on':''}" onclick="S.dc='OVERVIEW';render()">Overview</span>
    <span class="gap"></span><span class="glab">Totals</span>

    <span class="gap"></span><span class="glab">Dry</span>
    ${['CDC (Dry)','MKD1','MKB','MKD2','HDC','WFDC'].map(s=>`<span class="sc ${S.dc===s?'on':''}" onclick="S.dc='${s}';render()">${s}</span>`).join('')}
    <span class="gap"></span><span class="glab">Fresh</span>
    ${['CDC (Fresh)','MKF','MKM','LPDC'].map(s=>`<span class="sc ${S.dc===s?'on':''}" onclick="S.dc='${s}';render()">${s}</span>`).join('')}

}
function dcOverview(el, chipsRow){
  const i=mi(S.month);
  const dryT=pSum(dcWH('Dry')), freshT=pSum(dcWH('Fresh')), tot=dryT+freshT;
  const fx=pSum(add(dcMB('Dry','fixed_cost'),dcMB('Fresh','fixed_cost'))), vr=pSum(add(dcMB('Dry','variable_cost'),dcMB('Fresh','variable_cost')));
  const rows=DC_ORDER.map(sh=>{
    const wh=dcWH(sh); const isDry=RAW.dc[sh].temp==='Dry';
    const vol=isDry? dcRaw(sh,'inbound_case') : dcRaw(sh,'ton');
    const u=isDry? unitNow(dcRaw(sh,'total_wh'),dcRaw(sh,'inbound_case')) : unitNow(dcRaw(sh,'total_wh'),dcRaw(sh,'ton').map(t=>t*1000));

      fMB(pSum(wh)), (pSum(wh)/tot*100).toFixed(1)+'%',
      isDry? fmt(pSum(vol)/1e6,2)+'M cases' : fmt(pSum(vol),0)+' t',
      (u!=null && u>0? fmt(u,2) : '<span class="mut">–</span>')+(isDry?' /case':' /kg'),
      pctCell(pPrev(wh)? pSum(wh)/pPrev(wh)-1 : null), pctCell(pYoY(wh)? pSum(wh)/pYoY(wh)-1 : null)];
  });
  el.innerHTML = chipsRow + `
  <div class="grid cards4">
    ${kpi({title:'Total Distribution Center Cost',val:fMB(tot),unit:'MB',sub:'incl. TFRS16 · excl. Mid-Mile',chips:[chip(tot,pPrev(add(dcWH('Dry'),dcWH('Fresh'))),cmpLbl()),chip(tot,pYoY(add(dcWH('Dry'),dcWH('Fresh'))),'YoY')]})}
    ${kpi({title:'Dry Distribution Centers (6)',val:fMB(dryT),unit:'MB',sub:(dryT/tot*100).toFixed(1)+'% of DC cost',chips:[chip(dryT,pPrev(dcWH('Dry')),cmpLbl()),chip(dryT,pYoY(dcWH('Dry')),'YoY')]})}
    ${kpi({title:'Fresh Distribution Centers (4)',val:fMB(freshT),unit:'MB',sub:(freshT/tot*100).toFixed(1)+'% of DC cost',chips:[chip(freshT,pPrev(dcWH('Fresh')),cmpLbl()),chip(freshT,pYoY(dcWH('Fresh')),'YoY')]})}
    ${kpi({title:'Fixed vs Variable',val:(fx/(fx+vr)*100).toFixed(0)+'<span style="font-size:18px">%</span>',unit:'fixed',sub:'of tagged operating cost · variable '+(vr/(fx+vr)*100).toFixed(0)+'%'})}
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card">${chBox('chDCtrend',290,'Distribution Center cost trend — Dry vs Fresh (MB)'+DH)}</div>

  </div>
  <div class="card" style="margin-top:14px"><h4>Location summary — ${modeLbl()}</h4>
    ${tbl(['Distribution Center','DC Cost (MB)','Share','Volume','Unit Cost (THB)',cmpLbl(),'YoY'],rows,
      ['<b>Total (10 DCs)</b>',fMB(tot),'100%','–','–','',''])}
    <div class="note">DC operation cost only (incl. TFRS16). Unit cost = warehouse cost ÷ inbound cases (Dry) or ÷ kg (Fresh), excl. TFRS16 & Mid-Mile — matches “DC Cost/Case · DC Cost/Kg.” rows in the data file. Mid-Mile is a separate workbook and is shown on the Mid-Mile Transport page. CDC appears twice by design (Dry & Fresh operations). MKD1/MKD2 can show negative months (credit/allocation entries in the source file).</div>
  </div>`;
  mkChart('chDCtrend',{type:'bar',data:{labels:wLBL(),datasets:[
    {label:'Dry',data:sl(dcWH('Dry')),backgroundColor:TEMP_COLOR.Dry,stack:'s',borderRadius:3,drill:i=>`S.month='${MONTHS[winStart()+i]}';S.dc='Dry';render()`},
    {label:'Fresh',data:sl(dcWH('Fresh')),backgroundColor:TEMP_COLOR.Fresh,stack:'s',borderRadius:3,drill:i=>`S.month='${MONTHS[winStart()+i]}';S.dc='Fresh';render()`}]},

  mkChart('chDCrank',{type:'bar',data:{labels:rank.map(r=>r.sh),datasets:[{label:'DC cost',data:rank.map(r=>r.v),backgroundColor:rank.map(r=>DC_COLOR[r.sh]),borderRadius:4,dl:dlMB1,drill:i=>`S.dc='${rank[i].sh}';render()`}]},
    options:{indexAxis:'y',...padR,shareOf:'total DC cost',plugins:{legend:{display:false},avg:{value:rank.reduce((a,b)=>a+b.v,0)/(rank.length||1),label:'avg'}},scales:{x:{...gridY,title:{display:true,text:'MB'}},y:gridX}}});
}
function dcDetail(el, chipsRow, sh){
  const i=mi(S.month); const isDry=RAW.dc[sh].temp==='Dry'; const nm=RAW.dc[sh].name;
  const whT=dcRaw(sh,'total_wh'), whMB=dcWH(sh);
  const vol=isDry? dcRaw(sh,'inbound_case') : dcRaw(sh,'ton').map(t=>t*1000);
  const u=unitNow(whT,vol);
  const fx=pSum(dcMB(sh,'fixed_cost')), vr=pSum(dcMB(sh,'variable_cost'));
  const outs=pSum(dcMB(sh,'outsourcing')), gen=pSum(dcMB(sh,'general'));
  const movers=DC_SECS.map(([k,n])=>({n, cur:dcMB(sh,k)[i], d:dcMB(sh,k)[i]-(dcMB(sh,k)[i-1]||0), p:mom(dcMB(sh,k),i)}))
    .sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,5);
  /* ---- unit cost analysis: this site vs its temperature peers ---- */
  const volOf = x => RAW.dc[x].temp==='Dry' ? dcRaw(x,'inbound_case') : dcRaw(x,'ton').map(t=>t*1000);
  const peers = DC_ORDER.filter(x=>RAW.dc[x].temp===RAW.dc[sh].temp);   /* the 6 Dry or 4 Fresh sites */
  const peerAgg = RAW.dc[sh].temp;                                       /* 'Dry' | 'Fresh' aggregate sheet */
  const aggCost = dcRaw(peerAgg,'total_wh'), aggVol = volOf(peerAgg);
  const uPeer   = unitNow(aggCost, aggVol);
  const uGap    = (u!=null && uPeer) ? u/uPeer-1 : null;
  const volShare= pSum(aggVol)? pSum(vol)/pSum(aggVol) : 0;
  /* peers ranked — a negative rate is not a real unit cost, so it is left out */
  const peerRank = peers.map(x=>({x, v:unitNow(dcRaw(x,'total_wh'), volOf(x))}))
    .filter(r=>r.v!=null && isFinite(r.v) && r.v>0).sort((a,b)=>b.v-a.v);
  /* historical unit cost table for this site (replaces the trend chart) */

/* =========================== FULFILLMENT CENTER =========================== */
function pgFC(el){
  const chipsRow=`<div class="selrow">
    <span class="sc ${S.fc==='OVERVIEW'?'on':''}" onclick="S.fc='OVERVIEW';render()">Overview</span><span class="gap"></span>
    ${FC_ORDER.map(c=>`<span class="sc ${S.fc===c?'on':''}" onclick="S.fc='${c}';render()">${FC_SHORT[c]}</span>`).join('')}
  </div>`;
  if(mi(S.month)<FC_START){ el.innerHTML=chipsRow+`<div class="card"><h4>No B2C data for ${label(S.month)}</h4><div class="mini">Fulfillment-center reporting starts January 2026. Pick a 2026 month.</div></div>`; return; }
  if(S.fc==='OVERVIEW') return fcOverview(el, chipsRow);
  fcDetail(el, chipsRow, S.fc);
}
/* period-aware AOV (THB/order): monthly = P&L AOV row; YTD = Σsales ÷ Σorders */
/* orders summed over the page period (one month in Monthly, Jan..selected in YTD) */
function pOrders(f){ return periodIdx().reduce((a,k)=>a+(f.orders[k]||0),0); }
/* orders over the comparison basis: previous month, or same period last year in YTD */
function pOrdersPrev(f){
  const i=mi(S.month);
  const idx = (S.mode==='M') ? (i>0?[i-1]:[]) : periodIdx().map(k=>k-12).filter(k=>k>=0);
  return idx.reduce((a,k)=>a+(f.orders[k]||0),0);
}
function aovOf(f){
  if(S.mode==='M') return f.aov[mi(S.month)] || null;
  const ords=pOrders(f);
  const s=pSum(f.sales);
  return (ords && s)? s*1e6/ords : null;
}
function fcOverview(el, chipsRow){
  const i=mi(S.month);
  const op=sumFC('op'), sales=sumFC('sales');
  const rows=FC_ORDER.map(c=>{const f=FC[c];
    const s=pSum(f.sales), o=pSum(f.op);
    /* orders and cost/order follow the page period, not a single month */
    const ord=pOrders(f), cpo=ord? o*1e6/ord : null;
    const av=aovOf(f);
    return [`<span class="name">${f.name}</span> ${c==='FC409'?BADGES.fc409:''}${c==='FC403'?BADGES.fc403:''}`,
      s?fMB(s):'<span class="mut">–</span>',
      av? fmt(av,0):'<span class="mut">–</span>', `<b>${fMB(o)}</b>`,
      s? (o/s*100).toFixed(1)+'%' : '<span class="mut">–</span>',
      cpo? fmt(cpo,0):'<span class="mut">–</span>', pctCell(pPrev(f.op)? o/pPrev(f.op)-1:null)];
  });
  const ordAll=periodIdx().reduce((a,k)=>a+FC_ORDER.reduce((x,c)=>x+(FC[c].orders[k]||0),0),0);
  const aovAll=(ordAll && pSum(sales))? pSum(sales)*1e6/ordAll : null;
  const c2s = pSum(sales)? pSum(op)/pSum(sales)*100 : null;
  const aovRank = FC_ORDER.map(c=>({c, v:aovOf(FC[c])})).filter(x=>x.v).sort((a,b)=>b.v-a.v);
  const aovAvg = aovRank.length? aovRank.reduce((a,b)=>a+b.v,0)/aovRank.length : null;
  el.innerHTML = chipsRow + `
  <div class="grid cards4">
    ${kpi({title:'B2C FC Operation Cost',val:fMB(pSum(op)),unit:'MB',sub:'delivery reported under Last-Mile',chips:[chip(pSum(op),pPrev(op),cmpLbl())]})}
    ${kpi({title:'Sales (GMV)',val:fMB(pSum(sales)),unit:'MB',sub:'e-commerce gross merchandise value',badge:' '+srcBadge(),chips:[chip(pSum(sales),pPrev(sales),cmpLbl(),true)]})}
    ${kpi({title:'Cost-to-Sale',val:c2s!=null?c2s.toFixed(1):'–',unit:'%',sub:'FC operation ÷ sales',badge:' '+srcBadge()})}
    ${kpi({title:'Average AOV',val:aovAll?fmt(aovAll,0):'–',unit:'THB/order',sub:'Σ sales ÷ Σ orders'})}
  </div>
  <div class="grid g2e" style="margin-top:14px">
    <div class="card">${chBox('chFCsc',300,'Sales vs FC Operation cost by FC — '+modeLbl()+' (MB)'+DH)}</div>
    <div class="card">${chBox('chFCtrend',300,'FC operation cost trend by FC (MB) — labels = month total'+DH)}</div>
  </div>
  <div class="card" style="margin-top:14px">${chBox('chFCaov',300,'AOV by FC — '+modeLbl()+' (THB/order, ranked vs peer average)'+DH)}<div class="note">AOV = Sales ÷ orders. Shown as a ranked bar so it scales as more FCs are added; the dashed line is the average across FCs. FC409/FC411: no order data yet.</div></div>
  <div class="card" style="margin-top:14px"><h4>FC benchmark — ${modeLbl()}</h4>
    ${tbl(['Fulfillment Center','Sales (MB)','AOV (THB)','FC Operation (MB)','Cost-to-Sale','Cost/Order (THB)',cmpLbl()],rows,
      ['<b>B2C Total</b>',fMB(pSum(sales)),aovAll?fmt(aovAll,0):'–',fMB(pSum(op)),pSum(sales)?(pSum(op)/pSum(sales)*100).toFixed(1)+'%':'–','',''])}
    <div class="note">Source: FC P&L sheet (KTHB → MB). Cost = FC operation only; its delivery sits in the Last-Mile total. FC409 from its account sheet. Cost/Order shown for the selected month.</div>
  </div>`;
  /* each FC in its own master colour (the same FC_COLOR used by AOV-by-FC and the trend),
     the two series told apart by tone: Sales = lighter, FC operation = full colour. */
  mkChart('chFCsc',{type:'bar',data:{labels:FC_ORDER.map(c=>FC_SHORT[c]),datasets:[
    {label:'Sales',data:FC_ORDER.map(c=>pSum(FC[c].sales)),backgroundColor:FC_ORDER.map(c=>lighten(FC_COLOR[c],0.5)),legendColor:lighten(C.ink2,0.5),borderRadius:4,dl:dlMB1,drill:i=>`S.fc='${FC_ORDER[i]}';render()`},
    {label:'FC operation',data:FC_ORDER.map(c=>pSum(FC[c].op)),backgroundColor:FC_ORDER.map(c=>FC_COLOR[c]),legendColor:C.ink2,borderRadius:4,dl:dlMB1,drill:i=>`S.fc='${FC_ORDER[i]}';render()`}]},
    options:{...padT,scales:{x:gridX,y:{...gridY,title:{display:true,text:'MB'}}}}});
  mkChart('chFCtrend',{type:'bar',data:{labels:fLBL(),datasets:FC_ORDER.map((c,k)=>({label:FC_SHORT[c],data:fsl(FC[c].op),backgroundColor:FC_COLOR[c],stack:'s',drill:`S.fc='${c}';render()`}))},
    options:{...padT,plugins:{stackTotals:dlMB0},scales:{x:{...gridX,stacked:true},y:{...gridY,stacked:true,title:{display:true,text:'MB'}}}}});
  mkChart('chFCaov',{type:'bar',data:{labels:aovRank.map(x=>FC_SHORT[x.c]),datasets:[
    {label:'AOV',data:aovRank.map(x=>x.v),backgroundColor:aovRank.map(x=>FC_COLOR[x.c]),borderRadius:4,dl:{dec:0},drill:i=>`S.fc='${aovRank[i].c}';render()`}]},
    options:{indexAxis:'y',...padR,plugins:{legend:{display:false},avg:{value:aovAvg,label:'avg '+(aovAvg?fmt(aovAvg,0):'')+' THB'}},scales:{x:{...gridY,title:{display:true,text:'THB/order'}},y:gridX}}});
}
function fcDetail(el, chipsRow, code){
  const i=mi(S.month); const f=FC[code];
  /* every figure on this card row follows the page period, not a single month */
  const sales=pSum(f.sales), t=pSum(f.total), o=pSum(f.op), l=pSum(f.lm);
  const ord=pOrders(f), ordPrev=pOrdersPrev(f);
  const avNow=aovOf(f);
  const cpoPrev=(()=>{ const ii=(S.mode==='M')?(i>0?[i-1]:[]):periodIdx().map(k=>k-12).filter(k=>k>=0);
    if(!ii.length) return null;
    const oo=ii.reduce((a,k)=>a+(f.orders[k]||0),0), cc=ii.reduce((a,k)=>a+(f.op[k]||0),0);
    return oo? cc*1e6/oo : null; })();
  /* days in the period, so orders/day is right in YTD as well as Monthly */
  const pDays=(cd)=>periodIdx().reduce((a,k)=>a+(alignPnlDays(cd,k)||30),0);
  /* period totals over period orders — not month i, or YTD would divide a year of
     cost by one month of orders and report a rate roughly seven times too high */
  const cpo=ord? t*1e6/ord:null, wpo=ord? o*1e6/ord:null, lpo=ord? l*1e6/ord:null;
  const fcRaw=RAW.fc[code]; const shMonths=fcRaw.months.map(mo=>mi(mo)).filter(k=>k>=fWinStart()&&k<=winEnd());

/* =========================== LAST-MILE DELIVERY ===========================
   Built to the KPI list in "Summary Last mile cost … Re.2.xlsx"
   (sheets 1.Overview / 2.Store / 3.FC / 4.Local / 5.Performance Cost).
   Sales come from RMS; money is converted THB → MB. Local is still being
   built by the business, so it carries an explicit "under construction" note. */
const LM_TABS = [['OVERVIEW','Overview'],['STORE','Store'],['FC','FC'],['LOCAL','Local'],['PERF','Performance']];

/* Per-FC last-mile breakdown for the reporting month. Cost-to-sales is computed per
   site from that site's own cost and sales, never from the network average. */
function lmFcSiteTable(j){
  const sites = (RAW.lmd && RAW.lmd.fc_sites) || [];
  if(!sites.length) return '<div class="note">The last-mile workbook carries no per-FC rows for this month.</div>';
  const srt = sites.slice().sort((a,b)=> b.cost - a.cost);
  const tot = srt.reduce((a,x)=>a+x.cost,0), totS = srt.reduce((a,x)=>a+x.sales,0);
  const rows = srt.map(x=>{
    const r = x.sales? x.cost/x.sales*100 : null;
    return [`<span class="name"><span class="swatch" style="background:${FC_COLOR[x.code]||C.slate}"></span>${esc(FC_SHORT[x.code]||x.name||x.code)}</span>`,
            fMB(x.cost/1e6), fMB(x.sales/1e6),
            r!=null? r.toFixed(2)+'%' : '<span class="mut">–</span>',
            fmt(x.fleet,0),
            tot? (x.cost/tot*100).toFixed(1)+'%' : ''];
  });
  rows.push([`<b>All FC</b>`, `<b>${fMB(tot/1e6)}</b>`, `<b>${fMB(totS/1e6)}</b>`,
             `<b>${totS? (tot/totS*100).toFixed(2)+'%' : '–'}</b>`,
             `<b>${fmt(srt.reduce((a,x)=>a+x.fleet,0),0)}</b>`, '<b>100%</b>']);
  return tbl(['Fulfillment center','Cost (MB)','Sales (MB)','Cost/Sales','Fleet','Share'], rows);
}

/* period helpers that follow the last-mile calendar (its data may lag the P&L) */
function lmPeriod(){
  const j=lmIdx(); if(j<0) return [];
  if(S.mode==='M') return [j];
  const y=M[j].split('-')[0]; const out=[];
  for(let k=0;k<=j;k++) if(M[k].startsWith(y) && LM.has[k]) out.push(k);
  return out;
}
const lmSum  = a => lmPeriod().reduce((s,k)=>s+(a[k]||0),0);
const lmAvg  = a => { const p=lmPeriod().filter(k=>a[k]); return p.length? p.reduce((s,k)=>s+a[k],0)/p.length : null; };
function lmPrev(a){
  const j=lmIdx(); if(j<0) return null;
  if(S.mode==='M'){ for(let k=j-1;k>=0;k--) if(LM.has[k]) return a[k]; return null; }
  const idx=lmPeriod().map(k=>k-12).filter(k=>k>=0 && LM.has[k]);
  return idx.length? idx.reduce((s,k)=>s+(a[k]||0),0) : null;
}
function lmPrevAvg(a){
  const j=lmIdx(); if(j<0) return null;
  if(S.mode==='M'){ for(let k=j-1;k>=0;k--) if(LM.has[k]&&a[k]) return a[k]; return null; }
  const idx=lmPeriod().map(k=>k-12).filter(k=>k>=0 && LM.has[k] && a[k]);
  return idx.length? idx.reduce((s,k)=>s+a[k],0)/idx.length : null;
}
function lmYoY(a){ const j=lmIdx(); if(j<0||S.mode!=='M') return null; return (j>=12 && LM.has[j-12] && a[j-12]) ? a[j-12] : null; }
const lmLbl = () => { const j=lmIdx(); return j<0? '–' : (S.mode==='M' ? label(M[j]) : 'YTD Jan–'+label(M[j]).split(' ')[0]+' '+M[j].split('-')[0]); };
/* month axis: the 12 last-mile-data months ending at lmIdx() — the effective last-mile
   month, which is the selected month when it has data, else the newest month that does.
   This keeps the last-mile trends in step with the KPI cards (which also use lmIdx). */
const lmAxis = () => { const out=[], e=lmIdx(); if(e<0) return out; const s=Math.max(0, e-(WIN-1)); LM.has.forEach((v,i)=>{ if(v && i>=s && i<=e) out.push(i); }); return out; };
const lmSeries = a => lmAxis().map(k=>a[k]);
const lmLabels = () => lmAxis().map(k=>LBL[k]);

/* =========================== AUTOMATED SELF-CHECK =========================== */
/* Re-computes every core identity for every month with data, entirely in the
   browser, and reports any figure that does not reconcile to the source file.
   This is the live "cross-check for miscalculation" surfaced on the User Guide. */
function runSelfCheck(){
  const out=[]; let pass=0;
  const rel=(a,b)=> (b==null||!isFinite(b)||Math.abs(b)<1e-9) ? (Math.abs(a)<1e-9?0:1) : Math.abs(a/b-1);
  const chk=(name,mo,a,b,tol)=>{ if(a==null||b==null||isNaN(a)||isNaN(b)) return; const d=rel(a,b); if(d<=tol) pass++; else out.push({name,mo,a,b,d}); };
  for(let i=0;i<=LAST;i++){
    const mo=M[i];
    /* B2B Grand-Total identity: Total WH cost + TFRS16 + Transport = Grand Total */
    ['Dry','Fresh'].concat(DC_ORDER).forEach(sh=>{
      const g=dcRaw(sh,'grand_total')[i];
      if(g) chk(sh+' — Grand Total = WH + TFRS16 + Transport', mo,
        dcRaw(sh,'total_wh')[i]+dcRaw(sh,'tfrs16')[i]+dcRaw(sh,'transport')[i], g, 0.0015);
    });
    /* stored vs recomputed unit costs (file rounds to 2 dp → 1% tolerance) */
    const din=dcRaw('Dry','inbound_case')[i];
    if(din){
      chk('Dry — DC Cost/Case (stored vs WH ÷ cases)', mo, dcRaw('Dry','total_wh')[i]/din, dcRaw('Dry','dc_cost_case')[i], 0.01);
      chk('Dry — B2B Cost/Case (stored vs Grand ÷ cases)', mo, dcRaw('Dry','grand_total')[i]/din, dcRaw('Dry','b2b_cost_case')[i], 0.01);
    }
    const dtr=dcRaw('Dry','trip')[i];
    if(dtr) chk('Dry — MM Cost/Trip (stored vs Transport ÷ trips)', mo, dcRaw('Dry','transport')[i]/dtr, dcRaw('Dry','mm_cost_trip')[i], 0.01);
    const ftn=dcRaw('Fresh','ton')[i];
    if(ftn) chk('Fresh — DC Cost/Kg (stored vs WH ÷ kg)', mo, dcRaw('Fresh','total_wh')[i]/(ftn*1000), dcRaw('Fresh','dc_cost_kg')[i], 0.01);
    /* FC: Total Cost = Operation + Last-Mile */
    FC_ORDER.forEach(c=>{ const f=FC[c]; if(f.total[i]) chk(f.name+' — Total = Operation + Last-Mile', mo, f.op[i]+f.lm[i], f.total[i], 0.01); });
    /* Total SCM = sum of the four reported segments */
    if(SEG.total[i]) chk('Total SCM = DC (incl TFRS16) + Mid-Mile + FC Operation + Last-Mile (FC+Store+Local)', mo, SEG.b2bWH[i]+SEG.midMile[i]+SEG.fcOp[i]+SEG.lastMile[i], SEG.total[i], 1e-6);
  }
  return {pass, fail:out.length, rows:out};
}

/* KPI dictionary live search (User Guide §③) */
function filterKPI(q){
  q=(q||'').trim().toLowerCase();
  const t=document.getElementById('kpiTable'); if(!t) return;
  let shown=0;
  t.querySelectorAll('tbody tr').forEach(tr=>{ const ok=(!q || tr.textContent.toLowerCase().indexOf(q)>=0); tr.style.display=ok?'':'none'; if(ok) shown++; });
  const n=document.getElementById('kpiCount'); if(n) n.textContent = shown+' shown';
}

      ['transport','Mid-Mile cost (MB)', r=>dcMB(r.t,'transport')[r.i]],
      ['trips','Trips (Dry)', r=>r.t==='Dry'? dcRaw('Dry','trip')[r.i] : null],
      ['costtrip','Cost / trip (THB, Dry)', r=>{if(r.t!=='Dry')return null; const tr=dcRaw('Dry','trip')[r.i]; return tr? dcRaw('Dry','transport')[r.i]/tr : null;}],
      ['costcase','Cost / case (THB, Dry)', r=>{if(r.t!=='Dry')return null; const oc=dcRaw('Dry','outbound_case')[r.i]; return oc? dcRaw('Dry','transport')[r.i]/oc : null;}],
      ['costkg','Cost / kg (THB, Fresh)', r=>{if(r.t!=='Fresh')return null; const tn=dcRaw('Fresh','ton')[r.i]; return tn? dcRaw('Fresh','transport')[r.i]/(tn*1000) : null;}],
    ]},
  fc: { name:'Fulfillment Center — by site and month', unit:'MB / orders / THB',
    note:'One row per fulfillment center per month, from the FC P&L. Orders = average orders per day × days. Cost per order includes operation + last-mile.',
    rows:()=>{const o=[];FC_ORDER.forEach(c=>MONTHS.forEach((m,i)=>{ if(i>=FC_START) o.push({c,i}); }));return o;},
    cols:[
      ['month','Month', r=>M[r.i]],
      ['fc','Fulfillment Center', r=>FC_SHORT[r.c]],
      ['sales','Sales (MB)', r=>FC[r.c].sales[r.i]],
      ['op','Operation cost (MB)', r=>FC[r.c].op[r.i]],
      ['lm','Last-mile cost, FC P&L (MB)', r=>FC[r.c].lm[r.i]],
      ['total','Total cost (MB)', r=>FC[r.c].total[r.i]],
      ['fix','Fixed cost (MB)', r=>FC[r.c].fixed[r.i]],
      ['var','Variable cost (MB)', r=>FC[r.c].vari[r.i]],
      ['orders','Orders', r=>FC[r.c].orders[r.i]],
      ['aov','AOV (THB)', r=>FC[r.c].aov[r.i]],
      ['cpo','Cost per order (THB)', r=>FC[r.c].orders[r.i]? FC[r.c].total[r.i]*1e6/FC[r.c].orders[r.i] : null],
      ['c2s','Cost to sales', r=>FC[r.c].sales[r.i]? FC[r.c].total[r.i]/FC[r.c].sales[r.i] : null],
    ]},
  lm: { name:'Last-Mile Delivery — total by month', unit:'MB / counts',
    note:'One row per month from LMD Cost Data.xlsb (sheet "Summary on 2026"). Store cost is derived as Total − FC − Local; every other figure is read directly.',
    rows:()=>{const o=[];LM.has.forEach((h,i)=>{ if(h && i<=LAST) o.push({i}); });return o;},
    cols:[
      ['month','Month', r=>M[r.i]],
      ['cost','Total delivery cost (MB)', r=>LM.cost[r.i]],
      ['store','Store channel (MB)', r=>LM.store.cost[r.i]],
      ['fc','FC channel (MB)', r=>LM.fc.cost[r.i]],
      ['local','Local channel (MB)', r=>LM.local.cost[r.i]],
      ['w4','4W cost (MB)', r=>LM.cost4W[r.i]],
      ['w2','2W cost (MB)', r=>LM.cost2W[r.i]],
      ['driver','Driver cost (MB)', r=>LM.driver[r.i]],
      ['helper','Helper cost (MB)', r=>LM.helper[r.i]],
      ['sales','Sales Store+FC, RMS (MB)', r=>LM.sales[r.i]],
      ['c2s','Cost to sales', r=>LM.sales[r.i]? LM.cost[r.i]/LM.sales[r.i] : null],
      ['t4','Fleet 4W', r=>LM.trucks4W[r.i]],
      ['t2','Fleet 2W', r=>LM.trucks2W[r.i]],
      ['helpers','Helpers', r=>LM.helpers[r.i]],
      ['trip','Trips / truck / day', r=>LM.tripDay[r.i]],
      ['drop','Drops / truck / day', r=>LM.dropDay[r.i]],
      ['dist','KM / truck / day', r=>LM.distDay[r.i]],
      ['ctruck','Cost / truck (THB)', r=>LM.costTruck[r.i]],
      ['cinv','Cost / invoice (THB)', r=>LM.costInv[r.i]],
    ]},
  lmfc: { name:'Last-Mile — FC sites (LMD detail sheet)', unit:'MB / trucks',
    note:'From "Details Cost by Store", rows where Store Type = FC. Reporting month '+(LM.ok&&LM_LAST>=0? label(M[LM_LAST]):'—')+'. Shown next to the FC P&L figures so the two systems can be compared.',
    rows:()=>(LM.ok? LM.sites.map(s=>({s})) : []),
    cols:[
      ['store','Store code', r=>r.s.store],
      ['fc','FC', r=>r.s.name],
      ['cost','Delivery cost, LMD (MB)', r=>r.s.costMB],
      ['sales','Sales, RMS (MB)', r=>r.s.salesMB],
      ['fleet','Fleet (trucks)', r=>r.s.fleet],
      ['c2s','Cost to sales, LMD', r=>r.s.sales? r.s.cost/r.s.sales : null],
      ['pnlcost','Delivery cost, FC P&L (MB)', r=>FC[r.s.code]? FC[r.s.code].lm[LM_LAST] : null],
      ['pnlsales','Sales, FC P&L / AO (MB)', r=>FC[r.s.code]? FC[r.s.code].sales[LM_LAST] : null],
      ['gap','Cost gap LMD − FC P&L (MB)', r=>FC[r.s.code]? r.s.costMB - FC[r.s.code].lm[LM_LAST] : null],
    ]},
};
function rawCols(){ const d=RAW_DS[RAWSEL.ds];
  if(!RAWSEL.cols) RAWSEL.cols = d.cols.map(c=>c[0]);
  return d.cols.filter(c=>RAWSEL.cols.indexOf(c[0])>=0); }
function rawToggle(key){ const i=RAWSEL.cols.indexOf(key);
  if(i>=0){ if(RAWSEL.cols.length>1) RAWSEL.cols.splice(i,1); } else RAWSEL.cols.push(key);
  render(); }
function rawSetDs(ds){ RAWSEL.ds=ds; RAWSEL.cols=null; render(); }
function rawAll(on){ RAWSEL.cols = on? RAW_DS[RAWSEL.ds].cols.map(c=>c[0]) : [RAW_DS[RAWSEL.ds].cols[0][0]]; render(); }
function rawMatrix(){
  const d=RAW_DS[RAWSEL.ds], cols=rawCols();
  const head=cols.map(c=>c[1]);
  const body=d.rows().map(r=>cols.map(c=>{ const v=c[2](r); return (v==null||v==='')? '' : v; }));
  return {head, body};
}
function rawCSV(){
  const {head, body}=rawMatrix();
  const esc=v=>{ const s=String(v); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
  return [head.map(esc).join(',')].concat(body.map(r=>r.map(esc).join(','))).join('\r\n');
}
function rawDownload(){
  try{
    const blob=new Blob(['﻿'+rawCSV()], {type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='SCM_'+RAWSEL.ds+'_'+(M[LAST]||'export')+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }catch(e){ rawCopy(); }
}
function rawCopy(){
  const t=rawCSV();
  try{ navigator.clipboard.writeText(t); alert('Copied '+rawMatrix().body.length+' rows to the clipboard — paste straight into Excel.'); }
  catch(e){ window.prompt('Copy the CSV below (Ctrl/Cmd + C):', t); }
}
function pgRaw(el){
  const d=RAW_DS[RAWSEL.ds], cols=rawCols(), {head, body}=rawMatrix();
  const fmtCell=v=> typeof v==='number' ? fmt(v, Math.abs(v)>=1000?0:(Math.abs(v)>=10?2:4)) : v;
  const srcOf = { lm:'LM Cost Data.xlsb', lmfc:'LM Cost Data.xlsb', fc:'FC Cost Data (P&L)',
                  dc:'DC Cost Data (operation) + MM Cost Data (mid-mile)', summary:'all source files' }[RAWSEL.ds];
  el.innerHTML = `
  <div class="card" style="margin-bottom:14px">
    <div class="step"><span class="stepn">1</span><span class="steph">Choose a dataset</span>
      <span class="steps">${Object.keys(RAW_DS).length} available</span></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(215px,1fr))">
      ${Object.keys(RAW_DS).map(k=>{const t=RAW_DS[k].name.split(' — ');
        return `<div class="dscard ${RAWSEL.ds===k?'on':''}" onclick="rawSetDs('${k}')">
          <b>${t[0]}</b><span>${t[1]||''}</span></div>`;}).join('')}
    </div>
  </div>
  <div class="grid g2">
    <div class="card">
      <div class="step"><span class="stepn">2</span><span class="steph">Pick the columns</span>
        <span class="steps">${cols.length} of ${d.cols.length} selected</span></div>
      <div style="display:flex;gap:6px;margin-bottom:10px">
        <button class="btn" onclick="rawAll(true)">${ICO.all} Select all</button>
        <button class="btn" onclick="rawAll(false)">${ICO.clear} Clear</button>
      </div>
      <div class="collist">
        ${d.cols.map((c,ix)=>{const on=RAWSEL.cols.indexOf(c[0])>=0;
          return `<div class="colrow ${on?'on':''}" onclick="rawToggle('${c[0]}')">
            <span class="box">${on?ICO.check:''}</span>
            <span class="cname">${c[1]}</span>
            <span class="cnum">${ix+1}</span></div>`;}).join('')}
      </div>
      <div class="note">${d.note}</div>
    </div>
    <div class="card">
      <div class="step"><span class="stepn">3</span><span class="steph">Export</span></div>
      <div class="expbox">
        <div class="expfig"><b>${body.length.toLocaleString('en-US')}</b><span>rows</span></div>
        <div class="expx">×</div>
        <div class="expfig"><b>${cols.length}</b><span>columns</span></div>
        <div class="expfile">${ICO.file}<span>SCM_${RAWSEL.ds}_${M[LAST]}.csv</span></div>
      </div>
      <div class="sub">${d.unit}</div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn primary big" onclick="rawDownload()">${ICO.down} Download CSV</button>
        <button class="btn big" onclick="rawCopy()">${ICO.copy} Copy to clipboard</button>
      </div>
      <div class="note">Opens straight in Excel. Values export unrounded, so anything you build from the export matches the dashboard exactly. Money columns are in MB (millions of baht).</div>
      <div class="note"><b>Source:</b> ${srcOf} — the same arrays that draw the charts, so an export can never disagree with a page.</div>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h4>${ICO.table} All ${body.length.toLocaleString('en-US')} rows ${info('The whole table is here — scroll inside the box. The header stays in place as you scroll.')}</h4>
    <div class="rawscroll">${tbl(head, body.map(r=>r.map(fmtCell)))}</div>
  </div>`;
}
/* download box (bottom of Raw Data Export): hands back the original source workbooks
   embedded in this file. The last-mile .xlsb is not embedded (too large). */

/* =========================== COST DRIVER — ROOT CAUSE ===========================
   Every other page answers "what is the number". This one answers "what moved it".

   It decomposes the CHANGE, not the level, and it follows whatever the mode filter
   says — so the same page gives a different (and equally true) answer depending on
   whether you ask about the month or the year. That is the point of it: in July 2026
   the monthly culprit is DC general expenses, while year-to-date it is Dry mid-mile
   transport, which barely registers month on month. */
function pgDriver(el){
  const cur = periodIdx();
  const base = (()=> {                      // what "before" means in each mode
    const i=mi(S.month);
    if(S.mode==='C') return [mi(S.cmpA)];
    if(S.mode==='M') return i>0?[i-1]:[];
    return cur.map(k=>k-12).filter(k=>k>=0);
  })();
  const sum=(arr,idx)=> idx.reduce((a,k)=>a+(arr[k]||0),0);
  const dl =(arr)=> sum(arr,cur)-sum(arr,base);
  const basisLbl = S.mode==='C' ? label(S.cmpA)
                 : S.mode==='M' ? (mi(S.month)>0? label(M[mi(S.month)-1]) : '—')
                 : 'YTD '+(+S.month.slice(0,4)-1);

  if(!base.length){
    el.innerHTML = `<div class="card"><h4>Cost Driver</h4>
      <p class="sub">There is no earlier period to compare ${modeLbl()} against, so there is no
      change to decompose. Pick a later month, or switch mode.</p></div>`;
    return;
  }

  /* ---- level 1: the four segments ---- */
  const segs=[
    {n:'Distribution Center', v:dl(SEG.b2bWH),   c:SEGCOL.dcop, k:'dc'},
    {n:'Mid-Mile Transport',  v:dl(SEG.midMile), c:SEGCOL.mm,   k:'mm'},
    {n:'FC Operation',        v:dl(SEG.fcOp),    c:SEGCOL.fcop, k:'fc'},
    {n:'Last-Mile Delivery',  v:dl(SEG.lastMile),c:SEGCOL.lm,   k:'lm'},
  ];
  const total = dl(SEG.total);

  /* ---- level 2: what inside DC moved (the usual answer) ---- */
  const secs = DC_SECS.map(([k,n])=>({n, v: dl(add(dcMB('Dry',k), dcMB('Fresh',k)))}))
    .concat([{n:'TFRS16', v: dl(add(dcMB('Dry','tfrs16'), dcMB('Fresh','tfrs16')))}])
    .filter(r=>Math.abs(r.v)>=0.05).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
  const outsrc = dl(add(dcMB('Dry','outsourcing'), dcMB('Fresh','outsourcing')));

  /* ---- level 2: which FC moved ---- */
  const fcs = FC_ORDER.map(c=>({n:FC[c].name, v:dl(FC[c].op), c:FC_COLOR[c]}))
    .filter(r=>Math.abs(r.v)>=0.05).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));

  /* biggest single driver across everything we can name */
  const named=[...secs.map(r=>({...r,where:'Distribution Center'})),
               ...fcs.map(r=>({...r,where:'FC Operation'})),
               {n:'Mid-Mile Transport', v:dl(SEG.midMile), where:'Mid-Mile'},
               {n:'Last-Mile Delivery', v:dl(SEG.lastMile), where:'Last-Mile'}];
  const top = named.slice().sort((a,b)=>Math.abs(b.v)-Math.abs(a.v))[0];
  const share = (total && top) ? Math.abs(top.v/total*100) : null;

  const bar=(rows,mx)=> rows.map(r=>{
    const w=mx? Math.abs(r.v)/mx*100 : 0, neg=r.v<0;
    return `<tr><td><span class="name">${esc(r.n)}</span></td>
      <td style="width:48%"><div class="dbar"><div class="dfill" style="width:${w.toFixed(1)}%;
        background:${r.c||(neg?C.grey:C.navy)};${neg?'opacity:.55':''}"></div></div></td>
      <td style="text-align:right"><b class="${neg?'dn':'up'}">${neg?'':'+'}${fmt(r.v,2)}</b></td></tr>`;
  }).join('');
  const mxS=Math.max(...segs.map(r=>Math.abs(r.v)),0.01);
  const mxD=Math.max(...secs.map(r=>Math.abs(r.v)),0.01);
  const mxF=Math.max(...fcs.map(r=>Math.abs(r.v)),0.01);

  el.innerHTML = `
  <div class="grid cards3">
    ${kpi({title:'Total SCM change', val:(total>0?'+':'')+fmt(total,2), unit:'MB', hero:false,
      sub:modeLbl()+' vs '+esc(basisLbl)})}
    ${kpi({title:'Biggest single driver', val:top?esc(top.n):'–', unit:'',
      sub:top? ((top.v>0?'+':'')+fmt(top.v,2)+' MB · inside '+esc(top.where)) : ''})}
    ${kpi({title:'Share of the whole change', val:share!=null?fmt(share,0):'–', unit:'%',
      sub:'one line explains this much of the move'})}
  </div>

  <div class="section-h"><h5>Level 1 — which segment moved</h5><div class="ln"></div>
    <span class="mini">${modeLbl()} vs ${esc(basisLbl)} · MB</span></div>
  <div class="card"><table class="dtbl">${bar(segs,mxS)}
    <tr class="dtot"><td><b>Total SCM</b></td><td></td>
      <td style="text-align:right"><b class="${total<0?'dn':'up'}">${total<0?'':'+'}${fmt(total,2)}</b></td></tr>
  </table></div>

  <div class="grid g2e" style="margin-top:14px">
    <div class="card"><h4>Level 2 — inside Distribution Center ${info('Ledger sections, both temperatures combined. This is usually where the answer is.')}</h4>
      ${secs.length? `<table class="dtbl">${bar(secs,mxD)}</table>
      <p class="sub">Of the General movement, <b>${(outsrc>0?'+':'')+fmt(outsrc,2)} MB</b> is outsourcing —
        the single largest line in the whole build.</p>`
      : '<p class="sub">No DC section moved by more than 0.05 MB.</p>'}</div>
    <div class="card"><h4>Level 2 — inside FC Operation ${info('Per site. New and ramping sites dominate this list.')}</h4>
      ${fcs.length? `<table class="dtbl">${bar(fcs,mxF)}</table>`
      : '<p class="sub">No fulfillment centre moved by more than 0.05 MB.</p>'}</div>
  </div>

  <div class="card" style="margin-top:14px">
    <h4>How to read this</h4>
    <p class="sub">Bars are sized against the largest mover in their own group, so each level is readable on its
      own scale. Colour is meaning, not direction: <b class="up">red pushed cost up</b>,
      <b class="dn">green pulled it down</b>. Rows below ±0.05 MB are omitted, so the parts will not always add
      exactly to the total.
      <br><br><b>Change the mode and the answer changes</b> — that is not a bug. Monthly asks "what happened last
      month"; YTD asks "what has happened all year". A driver that dominates one can be invisible in the other,
      and fixing the monthly problem does not necessarily touch the annual one.</p>
  </div>`;
}
